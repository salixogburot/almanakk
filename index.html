<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800, initial-scale=1.0">
<title>Almanakk</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:       #f0ece3;
    --ink:      #1a1814;
    --muted:    #7a7060;
    --warm:     #c8a96e;
    --red:      #c0392b;
    --amber:    #d4874a;
    --blue:     #4a6fa5;
    --green:    #4a7c59;
    --divider:  rgba(26,24,20,0.12);
  }

  html, body {
    width: 800px;
    height: 480px;
    overflow: hidden;
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
  }

  /* ── LAYOUT ── */
  .page {
    width: 800px;
    height: 480px;
    display: grid;
    grid-template-columns: 190px 1fr 185px;
    grid-template-rows: 1fr auto;
    gap: 0;
    position: relative;
  }

  /* subtle texture overlay */
  .page::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(200,169,110,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(74,111,165,0.05) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── LEFT COLUMN ── */
  .col-left {
    grid-row: 1 / 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    border-right: 1px solid var(--divider);
    position: relative;
    z-index: 1;
    gap: 16px;
  }

  .sun-wrap {
    position: relative;
    width: 110px;
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .sun-svg {
    width: 110px;
    height: 110px;
  }

  .moon-svg {
    width: 80px;
    height: 80px;
  }

  .date-block {
    text-align: center;
  }

  .date-day {
    font-family: 'Playfair Display', serif;
    font-size: 52px;
    font-weight: 700;
    line-height: 1;
    color: var(--ink);
  }

  .date-month {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 2px;
  }

  .date-weekday {
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    font-style: italic;
    color: var(--warm);
    margin-top: 3px;
  }

  .nameday {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    line-height: 1.4;
    padding: 0 4px;
  }

  .nameday strong {
    display: block;
    font-size: 12px;
    color: var(--ink);
    font-weight: 500;
  }

  /* ── CENTER COLUMN ── */
  .col-center {
    grid-row: 1 / 2;
    display: flex;
    flex-direction: column;
    padding: 22px 20px 16px 22px;
    gap: 14px;
    position: relative;
    z-index: 1;
  }

  /* Current weather */
  .weather-now {
    display: flex;
    align-items: flex-start;
    gap: 16px;
  }

  .weather-icon-main {
    width: 56px;
    height: 56px;
    flex-shrink: 0;
  }

  .temp-main {
    font-family: 'Playfair Display', serif;
    font-size: 58px;
    font-weight: 700;
    line-height: 1;
    color: var(--ink);
    letter-spacing: -2px;
  }

  .temp-unit {
    font-size: 22px;
    font-weight: 300;
    color: var(--muted);
    vertical-align: super;
  }

  .temp-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .weather-desc {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    font-style: italic;
  }

  /* Sun row */
  .sun-row {
    display: flex;
    gap: 16px;
    align-items: center;
    padding: 8px 10px;
    background: rgba(200,169,110,0.12);
    border-radius: 8px;
  }

  .sun-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--ink);
  }

  .sun-item svg { flex-shrink: 0; }

  .sun-sep {
    flex: 1;
    height: 1px;
    background: var(--divider);
  }

  .daylight-diff {
    font-size: 11px;
    color: var(--green);
    font-weight: 500;
  }

  /* Combined temp + precip chart */
  .weather-chart {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .weather-chart svg {
    display: block;
    overflow: visible;
  }

  /* 4-day forecast */
  .forecast {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }

  .forecast-day {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 6px 4px;
    border-radius: 8px;
    background: rgba(26,24,20,0.04);
  }

  .fc-name {
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }

  .fc-icon { width: 28px; height: 28px; }

  .fc-temp {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
  }

  .fc-temp .lo {
    color: var(--muted);
    font-weight: 300;
  }

  /* ── RIGHT COLUMN ── */
  .col-right {
    grid-row: 1 / 2;
    display: flex;
    flex-direction: column;
    padding: 22px 16px 16px 12px;
    gap: 14px;
    position: relative;
    z-index: 1;
    border-left: 1px solid var(--divider);
  }

  .section-label {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }

  /* Moon – compact horizontal */
  .moon-block {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .moon-name {
    font-size: 11px;
    color: var(--muted);
    font-style: italic;
    line-height: 1.3;
  }

  /* Countdowns – compact horizontal pairs */
  .countdown-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .countdown-item {
    display: flex;
    align-items: baseline;
    gap: 4px;
  }

  .cd-label {
    font-size: 10px;
    color: var(--muted);
    flex: 1;
  }

  .cd-value {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.1;
  }

  .cd-unit {
    font-family: 'DM Sans', sans-serif;
    font-size: 9px;
    font-weight: 300;
    color: var(--muted);
  }

  /* Yellowstone – single line */
  .yellowstone {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 8px;
    border-radius: 6px;
    background: rgba(192,57,43,0.06);
    border: 1px solid rgba(192,57,43,0.15);
  }

  .ys-status {
    font-size: 11px;
    font-weight: 500;
    color: var(--ink);
    white-space: nowrap;
  }

  .ys-detail {
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .ys-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    margin-right: 4px;
    vertical-align: middle;
  }

  .ys-dot.active { background: var(--red); }

  /* Transit */
  .transit-block {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .transit-row {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .transit-line {
    background: #e8263d;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    width: 18px;
    height: 18px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .transit-min {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1;
  }

  .transit-min-unit {
    font-size: 9px;
    color: var(--muted);
  }

  .transit-realtime {
    font-size: 9px;
    color: var(--green);
    margin-left: auto;
  }

  .transit-realtime.delayed {
    color: var(--red);
  }

  /* ── BOTTOM BAR ── */
  .bottom-bar {
    grid-column: 2 / 4;
    grid-row: 2 / 3;
    border-top: 1px solid var(--divider);
    padding: 8px 20px 10px 22px;
    display: flex;
    align-items: center;
    gap: 20px;
    position: relative;
    z-index: 1;
  }

  /* Week calendar */
  .week-cal {
    display: flex;
    gap: 4px;
    align-items: flex-end;
  }

  .wk-day {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    width: 28px;
    padding: 4px 2px 3px;
    border-radius: 6px;
  }

  .wk-day.today {
    background: var(--ink);
  }

  .wk-name {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .wk-day.today .wk-name { color: rgba(255,255,255,0.6); }

  .wk-num {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
  }

  .wk-day.today .wk-num { color: #fff; }

  .bottom-sep {
    width: 1px;
    height: 30px;
    background: var(--divider);
  }

  /* Year progress */
  .year-progress {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .yr-label {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--muted);
  }

  .yr-bar-bg {
    height: 4px;
    border-radius: 2px;
    background: rgba(26,24,20,0.1);
    overflow: hidden;
  }

  .yr-bar-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--warm);
  }

  /* Birthday badge */
  .birthday-badge {
    font-size: 11px;
    color: var(--red);
    font-weight: 500;
    white-space: nowrap;
  }

  .updated {
    font-size: 9px;
    color: var(--muted);
    white-space: nowrap;
    margin-left: auto;
  }
</style>
</head>
<body>
<div class="page">

  <!-- LEFT: date + sun/moon -->
  <div class="col-left">
    <div id="orb-wrap" class="sun-wrap">
      <!-- filled by JS -->
    </div>
    <div class="date-block">
      <div class="date-day" id="date-day">--</div>
      <div class="date-month" id="date-month">---</div>
      <div class="date-weekday" id="date-weekday">---</div>
    </div>
    <div class="nameday" id="nameday-block">
      <strong id="nameday-names">···</strong>
      <span>har navnedag</span>
    </div>
  </div>

  <!-- CENTER: weather -->
  <div class="col-center">
    <div class="weather-now">
      <svg id="main-weather-icon" class="weather-icon-main" viewBox="0 0 56 56"></svg>
      <div>
        <div class="temp-main"><span id="temp-now">--</span><span class="temp-unit">°</span></div>
        <div class="temp-sub">Kjennes som <span id="feels-like">--</span>°</div>
        <div class="weather-desc" id="weather-desc">Henter vær…</div>
      </div>
    </div>

    <div class="sun-row">
      <div class="sun-item">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#d4874a" stroke-width="2">
          <circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="6"/>
          <line x1="12" y1="18" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="7.05" y2="7.05"/>
          <line x1="16.95" y1="16.95" x2="19.78" y2="19.78"/>
          <line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>
          <line x1="4.22" y1="19.78" x2="7.05" y2="16.95"/><line x1="16.95" y1="7.05" x2="19.78" y2="4.22"/>
        </svg>
        <span id="sunrise-time">--:--</span>
      </div>
      <div class="sun-sep"></div>
      <div class="daylight-diff" id="daylight-diff">+0 min</div>
      <div class="sun-sep"></div>
      <div class="sun-item">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4a6fa5" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <span id="sunset-time">--:--</span>
      </div>
    </div>

    <div class="weather-chart">
      <svg id="wx-chart" width="100%" height="90" viewBox="0 0 420 90" preserveAspectRatio="none"></svg>
    </div>

    <div class="forecast" id="forecast-row">
      <!-- filled by JS -->
    </div>
  </div>

  <!-- RIGHT: moon + countdowns + Yellowstone + transit -->
  <div class="col-right">

    <div class="moon-block">
      <svg id="moon-svg" class="moon-svg" viewBox="0 0 80 80" width="36" height="36"></svg>
      <div>
        <div class="section-label" style="margin-bottom:1px">Månefase</div>
        <div class="moon-name" id="moon-name">···</div>
      </div>
    </div>

    <div>
      <div class="section-label">Nedtelling</div>
      <div class="countdown-list" id="countdown-list"></div>
    </div>

    <div class="yellowstone" id="yellowstone-box">
      <div class="ys-status" id="ys-status"><span class="ys-dot"></span>···</div>
      <div class="ys-detail" id="ys-detail"></div>
    </div>

    <div class="transit-block">
      <div class="section-label">Godlia → sentrum</div>
      <div id="transit-list">···</div>
    </div>

  </div>

  <!-- BOTTOM: week + year -->
  <div class="bottom-bar">
    <div class="week-cal" id="week-cal"></div>
    <div class="bottom-sep"></div>
    <div class="year-progress">
      <div class="yr-label">
        <span>Uke <span id="week-num">--</span></span>
        <span id="year-pct">--%</span>
      </div>
      <div class="yr-bar-bg">
        <div class="yr-bar-fill" id="yr-bar" style="width:0%"></div>
      </div>
    </div>
    <div class="birthday-badge" id="birthday-badge"></div>
    <div class="updated" id="updated"></div>
  </div>

</div>

<script>
// ── CONFIG ──
const LAT = 59.9139, LON = 10.7522; // Oslo
const COUNTDOWNS = [
  { label: 'Til julaften', month: 12, day: 24 },
  { label: 'Fride 🎂', month: 3, day: 14 },
];
const DAYS   = ['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'];
const DAYS_S = ['søn','man','tir','ons','tor','fre','lør'];
const MONTHS = ['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'];
const MONTHS_S = ['jan','feb','mar','apr','mai','jun','jul','aug','sep','okt','nov','des'];

// Norwegian namedays (subset – full list)
const NAMEDAYS = {
  '01-01':'Nyttårsdag','01-06':'Hellig Tre Konger','01-13':'Hilarius','01-19':'Marius',
  '01-20':'Fabian, Sebastian','01-25':'Paulus','01-29':'Varius',
  '02-02':'Kyndelsmesse','02-05':'Agata','02-14':'Valentin','02-22':'Petter',
  '03-01':'Åsmund','03-08':'Internasjonale kvinnedagen','03-12':'Gregorius',
  '03-14':'Matilde','03-17':'Gertrude','03-19':'Josef','03-25':'Maria Bebudelsedag',
  '04-01':'April fools','04-23':'Georg','04-25':'Markus',
  '05-01':'Arbeidernes dag','05-17':'Grunnlovsdag','05-25':'Beda',
  '06-07':'Robert','06-15':'Vitus','06-24':'Jonsok / Hans',
  '07-04':'Ulrik','07-15':'Svein','07-20':'Elias','07-25':'Jakob',
  '08-05':'Oskar','08-10':'Laurits','08-24':'Bartolomeus',
  '09-08':'Maria fødselsdagen','09-14':'Helge kors','09-29':'Mikael',
  '10-04':'Frans av Assisi','10-18':'Lukas','10-31':'Reformasjonsdagen',
  '11-01':'Alle helgeners dag','11-11':'Mårten','11-25':'Katarina',
  '12-06':'Nikolaus','12-13':'Lucia','12-24':'Adam og Eva','12-25':'Jul','12-26':'Stefanus',
  '12-31':'Nyttårsaften'
};

// ── HELPERS ──
function pad(n){ return String(n).padStart(2,'0'); }
function dateKey(d){ return `${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

function weekNumber(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay()||7));
  const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
  return Math.ceil((((date - yearStart) / 86400000) + 1)/7);
}

function daysInYear(d){
  const start = new Date(d.getFullYear(),0,1);
  return Math.round((d-start)/86400000)+1;
}

function totalDaysInYear(y){
  return ((y%4===0&&y%100!==0)||y%400===0)?366:365;
}

function daysUntil(month, day){
  const now = new Date();
  let target = new Date(now.getFullYear(), month-1, day);
  if(target <= now) target = new Date(now.getFullYear()+1, month-1, day);
  return Math.ceil((target-now)/86400000);
}

// ── MOON ──
function moonPhase(date){
  const known = new Date(2000,0,6);
  const diff = (date - known) / 86400000;
  return ((diff % 29.530588853) + 29.530588853) % 29.530588853;
}

function moonName(phase){
  if(phase < 1.85)  return 'Nymåne';
  if(phase < 7.38)  return 'Voksende halvmåne';
  if(phase < 9.22)  return 'Første kvarter';
  if(phase < 14.77) return 'Voksende måne';
  if(phase < 16.61) return 'Fullmåne';
  if(phase < 22.15) return 'Minkende måne';
  if(phase < 23.99) return 'Siste kvarter';
  if(phase < 29.53) return 'Minkende halvmåne';
  return 'Nymåne';
}

function drawMoon(svgEl, phase){
  const size = 80, r = 32, cx = 40, cy = 40;
  const illum = phase / 29.530588853;
  const waxing = illum < 0.5;
  const pct = waxing ? illum*2 : (illum-0.5)*2;
  const rx = Math.abs(Math.cos(Math.PI * pct)) * r;
  const dark = '#1a1814', light = '#f0ece3', rim = '#7a7060';

  // background circle
  const circle = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${illum<0.5?dark:light}" stroke="${rim}" stroke-width="1"/>`;

  // terminator shape
  let path;
  if(illum < 0.02 || illum > 0.98){
    path = '';
  } else if(waxing){
    // left dark, right lit
    const sweep1 = 1, sweep2 = pct < 0.5 ? 0 : 1;
    path = `<path d="M ${cx} ${cy-r} A ${r} ${r} 0 0 1 ${cx} ${cy+r} A ${rx} ${r} 0 0 ${sweep2} ${cx} ${cy-r} Z" fill="${light}"/>`;
  } else {
    const sweep2 = pct < 0.5 ? 1 : 0;
    path = `<path d="M ${cx} ${cy-r} A ${r} ${r} 0 0 0 ${cx} ${cy+r} A ${rx} ${r} 0 0 ${sweep2} ${cx} ${cy-r} Z" fill="${dark}"/>`;
  }

  svgEl.innerHTML = circle + path;
}

// ── SUN ORB ──
function drawSun(container, isDay){
  if(isDay){
    container.innerHTML = `
      <svg class="sun-svg" viewBox="0 0 110 110">
        <!-- rays -->
        <g stroke="#d4874a" stroke-width="2.5" stroke-linecap="round" opacity="0.5">
          <line x1="55" y1="8" x2="55" y2="18"/>
          <line x1="55" y1="92" x2="55" y2="102"/>
          <line x1="8" y1="55" x2="18" y2="55"/>
          <line x1="92" y1="55" x2="102" y2="55"/>
          <line x1="22" y1="22" x2="29" y2="29"/>
          <line x1="81" y1="81" x2="88" y2="88"/>
          <line x1="88" y1="22" x2="81" y2="29"/>
          <line x1="22" y1="88" x2="29" y2="81"/>
        </g>
        <!-- glow -->
        <circle cx="55" cy="55" r="34" fill="#d4874a" opacity="0.15"/>
        <!-- body -->
        <circle cx="55" cy="55" r="26" fill="#d4874a"/>
        <circle cx="55" cy="55" r="26" fill="url(#sunGrad)"/>
        <defs>
          <radialGradient id="sunGrad" cx="40%" cy="35%">
            <stop offset="0%" stop-color="#f5c07a"/>
            <stop offset="100%" stop-color="#c0692a"/>
          </radialGradient>
        </defs>
      </svg>`;
  } else {
    container.innerHTML = `
      <svg class="moon-svg" viewBox="0 0 80 80">
        <circle cx="40" cy="40" r="28" fill="#c8bfae"/>
        <circle cx="40" cy="40" r="28" fill="url(#moonGrad)"/>
        <defs>
          <radialGradient id="moonGrad" cx="35%" cy="30%">
            <stop offset="0%" stop-color="#e8e0d0"/>
            <stop offset="100%" stop-color="#9a8f7a"/>
          </radialGradient>
        </defs>
        <!-- craters -->
        <circle cx="32" cy="36" r="4" fill="rgba(0,0,0,0.08)"/>

// ── WEATHER ICONS (SVG inline) ──
function weatherIcon(code, size=56){
  // simplified icon map
  const S = size;
  const sun = `<circle cx="${S/2}" cy="${S/2}" r="${S*0.23}" fill="#d4874a"/>`;
  const cloud = (x,y,s) => `<ellipse cx="${x}" cy="${y}" rx="${s*1.4}" ry="${s*0.9}" fill="#c8c0b0"/><ellipse cx="${x-s*0.6}" cy="${y+s*0.3}" rx="${s}" ry="${s*0.7}" fill="#c8c0b0"/>`;
  const rain = (x,y,s) => `<line x1="${x}" y1="${y}" x2="${x-s*0.2}" y2="${y+s*0.8}" stroke="#4a6fa5" stroke-width="1.5" stroke-linecap="round"/>`;

  if(!code) return `<circle cx="${S/2}" cy="${S/2}" r="${S*0.3}" fill="#d4874a" opacity="0.5"/>`;

  const c = parseInt(code);
  const svg = (content) => `<svg viewBox="0 0 ${S} ${S}" width="${S}" height="${S}">${content}</svg>`;

  if(c===1) return svg(sun); // clear
  if(c===2) return svg(sun + cloud(S*0.62, S*0.55, S*0.16)); // partly cloudy
  if(c===3) return svg(cloud(S*0.5, S*0.5, S*0.2) + cloud(S*0.45, S*0.52, S*0.18)); // cloudy
  if(c>=40&&c<=49) return svg(cloud(S*0.5,S*0.38,S*0.18) + rain(S*0.35,S*0.62,S*0.12) + rain(S*0.5,S*0.62,S*0.12) + rain(S*0.65,S*0.62,S*0.12));
  if(c>=70&&c<=79) return svg(`<circle cx="${S*0.5}" cy="${S*0.45}" r="${S*0.2}" fill="#e0dbd0"/><text x="${S*0.5}" y="${S*0.78}" text-anchor="middle" font-size="${S*0.22}" fill="#7a7060">❄</text>`);
  // default: cloud
  return svg(cloud(S*0.5, S*0.5, S*0.2));
}

// ── OPEN-METEO WEATHER ──
// WMO weather code → {label, iconCode}
function wmoInfo(code){
  if(code===0)                    return {label:'Klarvær',       icon:1};
  if(code===1)                    return {label:'Mest klart',    icon:1};
  if(code===2)                    return {label:'Delvis skyet',  icon:2};
  if(code===3)                    return {label:'Overskyet',     icon:3};
  if(code>=45&&code<=48)          return {label:'Tåke',          icon:15};
  if(code>=51&&code<=55)          return {label:'Yr',            icon:46};
  if(code>=56&&code<=57)          return {label:'Underkjølt yr', icon:46};
  if(code>=61&&code<=63)          return {label:'Regn',          icon:41};
  if(code===64||code===65)        return {label:'Kraftig regn',  icon:45};
  if(code>=66&&code<=67)          return {label:'Underkjølt regn',icon:41};
  if(code>=71&&code<=73)          return {label:'Snø',           icon:70};
  if(code===74||code===75)        return {label:'Kraftig snø',   icon:73};
  if(code===77)                   return {label:'Snøkorn',       icon:70};
  if(code>=80&&code<=82)          return {label:'Regnbyger',     icon:41};
  if(code>=83&&code<=84)          return {label:'Sludd',         icon:46};
  if(code>=85&&code<=86)          return {label:'Snøbyger',      icon:70};
  if(code>=95&&code<=99)          return {label:'Torden',        icon:6};
  return {label:'', icon:3};
}

async function fetchWeather(){
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`
      + `&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m`
      + `&hourly=precipitation,temperature_2m`
      + `&daily=weather_code,temperature_2m_max,temperature_2m_min`
      + `&timezone=Europe%2FOslo&forecast_days=5`;

    const r = await fetch(url);
    const data = await r.json();
    const cur = data.current;
    const daily = data.daily;

    // Current temp
    document.getElementById('temp-now').textContent = Math.round(cur.temperature_2m);
    document.getElementById('feels-like').textContent = Math.round(cur.apparent_temperature);

    // Weather description + icon
    const info = wmoInfo(cur.weather_code);
    document.getElementById('weather-desc').textContent = info.label;
    const iconEl = document.getElementById('main-weather-icon');
    if(iconEl) iconEl.outerHTML = weatherIcon(info.icon, 56);

    // Sunrise/sunset handled separately by met.no API
    fetchSunTimesCalc();

    // Draw combined weather chart
    if(data.hourly) drawWeatherChart(data.hourly);

    // 4-day forecast (skip today = index 0)
    const fc = document.getElementById('forecast-row');
    fc.innerHTML = daily.time.slice(1, 5).map((dateStr, i) => {
      const d = new Date(dateStr);
      const fi = wmoInfo(daily.weather_code[i + 1]);
      const max = Math.round(daily.temperature_2m_max[i + 1]);
      const min = Math.round(daily.temperature_2m_min[i + 1]);
      return `<div class="forecast-day">
        <span class="fc-name">${DAYS_S[d.getDay()]}</span>
        ${weatherIcon(fi.icon, 28)}
        <span class="fc-temp">${max}° <span class="lo">${min}°</span></span>
      </div>`;
    }).join('');

  } catch(e){
    console.error('Weather error:', e);
    document.getElementById('weather-desc').textContent = 'Ingen vær';
    // Still draw sun orb using formula
    fetchSunTimesCalc();
  }
}

// ── COMBINED WEATHER CHART (temp line + precip bars) ──
function drawWeatherChart(hourly){
  const svg = document.getElementById('wx-chart');
  if(!svg) return;

  const W = 420, H = 90;
  const padL = 28, padR = 8, padT = 10, padB = 18;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const HOURS = 24;

  // Find start index (current hour)
  const now = new Date();
  let startIdx = 0;
  for(let i = 0; i < hourly.time.length; i++){
    const t = new Date(hourly.time[i]);
    if(t >= now){ startIdx = i; break; }
  }

  const temps  = hourly.temperature_2m.slice(startIdx, startIdx + HOURS);
  const precip = hourly.precipitation.slice(startIdx, startIdx + HOURS);
  const times  = hourly.time.slice(startIdx, startIdx + HOURS);

  const minT = Math.floor(Math.min(...temps)) - 1;
  const maxT = Math.ceil(Math.max(...temps))  + 1;
  const maxP = Math.max(...precip, 1); // at least 1mm scale

  const xOf  = i => padL + (i / (HOURS - 1)) * chartW;
  const yOfT = t => padT + (1 - (t - minT) / (maxT - minT)) * chartH;
  const barW = chartW / HOURS * 0.65;

  let out = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"
    style="width:100%;height:90px;display:block;overflow:visible">
    <defs>
      <linearGradient id="tempGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#c0392b" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="#c0392b" stop-opacity="0"/>
      </linearGradient>
    </defs>`;

  // Grid lines + temp axis labels (left)
  const tempTicks = 3;
  for(let i = 0; i <= tempTicks; i++){
    const t = minT + (maxT - minT) * (i / tempTicks);
    const y = yOfT(t);
    out += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"
      stroke="#1a1814" stroke-opacity="0.07" stroke-width="0.5"/>`;
    out += `<text x="${padL - 3}" y="${y + 3}" text-anchor="end"
      font-size="7" fill="#7a7060" font-family="DM Sans,sans-serif">${Math.round(t)}°</text>`;
  }

  // Precipitation bars (behind temp line)
  precip.forEach((val, i) => {
    if(val <= 0) return;
    const x = xOf(i) - barW / 2;
    const barH2 = (val / maxP) * chartH * 0.45; // max 45% of chart height
    const y = padT + chartH - barH2;
    const isNow = i === 0;
    out += `<rect x="${x}" y="${y}" width="${barW}" height="${barH2}"
      rx="1.5"
      fill="${isNow ? '#d4874a' : '#4a6fa5'}"
      opacity="${val > 0.5 ? 0.75 : 0.45}"/>`;
  });

  // Temperature area fill
  const areaPoints = temps.map((t, i) => `${xOf(i)},${yOfT(t)}`).join(' ');
  const firstX = xOf(0), lastX = xOf(HOURS - 1);
  const baseY  = padT + chartH;
  out += `<polygon points="${firstX},${baseY} ${areaPoints} ${lastX},${baseY}"
    fill="url(#tempGrad)"/>`;

  // Temperature line
  const linePts = temps.map((t, i) => `${i === 0 ? 'M' : 'L'}${xOf(i)},${yOfT(t)}`).join(' ');
  out += `<path d="${linePts}" fill="none" stroke="#c0392b" stroke-width="1.8"
    stroke-linejoin="round" stroke-linecap="round"/>`;

  // Now-line
  out += `<line x1="${xOf(0)}" y1="${padT}" x2="${xOf(0)}" y2="${padT + chartH}"
    stroke="#d4874a" stroke-width="1" stroke-opacity="0.6" stroke-dasharray="2,2"/>`;

  // Time axis labels every 6h
  for(let i = 0; i < HOURS; i += 6){
    const t = new Date(times[i]);
    const x = xOf(i);
    const isNewDay = t.getHours() === 0;
    if(isNewDay){
      out += `<line x1="${x}" y1="${padT}" x2="${x}" y2="${padT + chartH}"
        stroke="#1a1814" stroke-opacity="0.12" stroke-width="0.5"/>`;
      out += `<text x="${x}" y="${H - 2}" text-anchor="middle"
        font-size="8" fill="#1a1814" font-family="DM Sans,sans-serif" font-weight="500">
        ${['søn','man','tir','ons','tor','fre','lør'][t.getDay()]}
      </text>`;
    } else {
      out += `<text x="${x}" y="${H - 2}" text-anchor="middle"
        font-size="8" fill="#7a7060" font-family="DM Sans,sans-serif">${pad(t.getHours())}</text>`;
    }
  }

  // Precip axis label (right side) if there's rain
  if(maxP > 0.2){
    out += `<text x="${W - padR}" y="${padT + chartH * 0.6}" text-anchor="end"
      font-size="7" fill="#4a6fa5" opacity="0.8"
      font-family="DM Sans,sans-serif">${maxP.toFixed(1)}mm</text>`;
  }

  out += `</svg>`;
  svg.outerHTML = out;
}

// ── ENTUR TRANSIT ──
async function fetchTransit(){
  const STOP_ID = 'NSR:StopPlace:5968'; // Godlia T-bane
  // Quay:10948 = plattform mot sentrum (Kolsås/Stortinget)
  // Quay:10949 = plattform mot Mortensrud
  const SENTRUM_QUAY = 'NSR:Quay:10948';

  const query = `{
    stopPlace(id:"${STOP_ID}") {
      estimatedCalls(timeRange:7200, numberOfDepartures:10, omitNonBoarding:true) {
        realtime
        expectedDepartureTime
        aimedDepartureTime
        destinationDisplay { frontText }
        quay { id }
        serviceJourney { line { publicCode } }
      }
    }
  }`;
  try {
    const r = await fetch('https://api.entur.io/journey-planner/v3/graphql', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'ET-Client-Name': 'salixogburot-almanakk'
      },
      body: JSON.stringify({ query })
    });
    const data = await r.json();
    console.log('Entur raw:', JSON.stringify(data?.data?.stopPlace, null, 2));
    const all = data?.data?.stopPlace?.estimatedCalls || [];
    const now = new Date();

    // Filtrer på riktig quay (retning sentrum)
    // Fallback: filtrer på destinasjon hvis quay-ID ikke matcher
    let calls = all.filter(c => c.quay?.id === SENTRUM_QUAY);
    if(!calls.length){
      // Fallback: ikke Mortensrud
      calls = all.filter(c => !(c.destinationDisplay?.frontText || '').includes('Mortensrud'));
    }

    const el = document.getElementById('transit-list');
    if(!calls.length){
      el.innerHTML = `<span style="font-size:10px;color:var(--muted);font-style:italic">Ingen avganger</span>`;
      return;
    }

    el.innerHTML = calls.slice(0, 4).map(c => {
      const exp   = new Date(c.expectedDepartureTime);
      const aimed = new Date(c.aimedDepartureTime);
      const mins  = Math.max(0, Math.round((exp - now) / 60000));
      const delay = Math.round((exp - aimed) / 60000);
      const lineCode = c.serviceJourney?.line?.publicCode || '3';
      const realtimeClass = delay > 1 ? 'delayed' : '';
      const realtimeText  = delay > 1 ? `+${delay}` : (c.realtime ? '✓' : '');
      return `<div class="transit-row">
        <span class="transit-line">${lineCode}</span>
        <span class="transit-min">${mins}</span><span class="transit-min-unit"> min</span>
        <span class="transit-realtime ${realtimeClass}">${realtimeText}</span>
      </div>`;
    }).join('');

  } catch(e){
    console.error('Transit error:', e);
    document.getElementById('transit-list').innerHTML =
      `<span style="font-size:10px;color:var(--muted)">–</span>`;
  }
}
function tzOffset(){
  // Norway: UTC+1 (winter) or UTC+2 (summer/DST)
  // DST: last Sunday March → last Sunday October
  const now = new Date();
  const jan = new Date(now.getFullYear(), 0, 1);
  const jul = new Date(now.getFullYear(), 6, 1);
  const stdOffset = Math.max(jan.getTimezoneOffset(), jul.getTimezoneOffset());
  const isDST = now.getTimezoneOffset() < stdOffset;
  return isDST ? '+02:00' : '+01:00';
}

function dateStr(d){
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

async function fetchSunriseMet(date){
  const offset = tzOffset();
  const url = `https://api.met.no/weatherapi/sunrise/3.0/sun`
    + `?lat=${LAT}&lon=${LON}&date=${dateStr(date)}&offset=${offset}`;
  const r = await fetch(url);
  const data = await r.json();
  const props = data.properties;
  return {
    rise: props.sunrise?.time ? new Date(props.sunrise.time) : null,
    set:  props.sunset?.time  ? new Date(props.sunset.time)  : null,
  };
}

async function fetchSunTimesCalc(){
  try {
    const now = new Date();
    const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
    const [today, yest] = await Promise.all([
      fetchSunriseMet(now),
      fetchSunriseMet(yesterday),
    ]);
    if(!today.rise || !today.set) return;

    const todayLen = today.set - today.rise;
    const yestLen  = yest.set && yest.rise ? yest.set - yest.rise : todayLen;
    const diffMin  = Math.round((todayLen - yestLen) / 60000);
    const sign     = diffMin >= 0 ? '+' : '';

    document.getElementById('sunrise-time').textContent  = fmtTime(today.rise);
    document.getElementById('sunset-time').textContent   = fmtTime(today.set);
    document.getElementById('daylight-diff').textContent = `${sign}${diffMin} min`;
    drawSun(document.getElementById('orb-wrap'), now >= today.rise && now <= today.set);
  } catch(e){
    console.warn('Sunrise API feil:', e);
  }
}

function fmtTime(d){ return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }

// ── YELLOWSTONE ──
async function fetchYellowstone(){
  const ysBox = document.getElementById('yellowstone-box');
  const ysStatus = document.getElementById('ys-status');
  const ysDetail = document.getElementById('ys-detail');
  try {
    const r = await fetch('https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&latitude=44.4280&longitude=-110.5885&maxradius=0.5&minmagnitude=1.0&limit=3&orderby=time');
    const data = await r.json();
    const quakes = data.features;
    if(!quakes || quakes.length === 0){
      ysStatus.innerHTML = '<span class="ys-dot"></span> Rolig';
      ysDetail.textContent = 'Ingen skjelv siste dager';
    } else {
      const q = quakes[0];
      const mag = q.properties.mag.toFixed(1);
      const place = q.properties.place;
      const ago = msAgo(q.properties.time);
      const dot = mag >= 3 ? 'active' : '';
      ysStatus.innerHTML = `<span class="ys-dot ${dot}"></span> M${mag}`;
      ysDetail.textContent = `${ago} — ${quakes.length} skjelv nylig`;
    }
  } catch(e){
    ysStatus.innerHTML = '<span class="ys-dot"></span> Utilgjengelig';
    ysDetail.textContent = '';
  }
}

function msAgo(ts){
  const ms = Date.now() - ts;
  const m = Math.floor(ms/60000);
  if(m < 60) return `${m} min siden`;
  const h = Math.floor(m/60);
  if(h < 24) return `${h} t siden`;
  return `${Math.floor(h/24)} d siden`;
}

// ── INIT ──
function init(){
  const now = new Date();
  const key = dateKey(now);

  // Date
  document.getElementById('date-day').textContent = now.getDate();
  document.getElementById('date-month').textContent = MONTHS[now.getMonth()] + ' ' + now.getFullYear();
  document.getElementById('date-weekday').textContent = DAYS[now.getDay()];

  // Nameday
  const nd = NAMEDAYS[key];
  document.getElementById('nameday-names').textContent = nd || '—';
  if(!nd) document.getElementById('nameday-block').style.opacity = '0.5';

  // Moon
  const phase = moonPhase(now);
  document.getElementById('moon-name').textContent = moonName(phase);
  drawMoon(document.getElementById('moon-svg'), phase);

  // Countdowns
  const cdList = document.getElementById('countdown-list');
  cdList.innerHTML = COUNTDOWNS.map(c => {
    const days = daysUntil(c.month, c.day);
    return `<div class="countdown-item">
      <span class="cd-label">${c.label}</span>
      <span class="cd-value">${days}<span class="cd-unit"> dager</span></span>
    </div>`;
  }).join('');

  // Week calendar
  const dow = now.getDay(); // 0=sun
  const monday = new Date(now);
  monday.setDate(now.getDate() - ((dow+6)%7));
  const wkEl = document.getElementById('week-cal');
  wkEl.innerHTML = '';
  for(let i=0; i<7; i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    const isToday = d.toDateString() === now.toDateString();
    const div = document.createElement('div');
    div.className = 'wk-day' + (isToday?' today':'');
    div.innerHTML = `<span class="wk-name">${DAYS_S[d.getDay()]}</span><span class="wk-num">${d.getDate()}</span>`;
    wkEl.appendChild(div);
  }

  // Week number
  document.getElementById('week-num').textContent = weekNumber(now);

  // Year progress
  const pct = Math.round(daysInYear(now)/totalDaysInYear(now.getFullYear())*100);
  document.getElementById('year-pct').textContent = pct + '%';
  document.getElementById('yr-bar').style.width = pct + '%';

  // Updated
  document.getElementById('updated').textContent =
    'oppdatert ' + fmtTime(now);

  // Async – fetchWeather also handles sunrise/sunset
  fetchWeather();
  fetchYellowstone();
  fetchBirthdays(key);
  fetchTransit();
}

init();
setInterval(init, 30*60*1000);
setInterval(fetchTransit, 2*60*1000); // avganger oppdateres hvert 2. minutt
